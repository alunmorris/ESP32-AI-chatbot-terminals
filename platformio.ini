[platformio]
default_envs = cyd28, c3, p3

[base_config]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DUSER_SETUP_LOADED
    -DLOAD_GLCD -DLOAD_FONT2 -DLOAD_FONT4 -DLOAD_GFXFF -DSMOOTH_FONT

[env:cyd28]
extends = base_config
board = esp32dev
upload_speed = 921600
build_src_filter = +<*> -<hal_c3.cpp>
lib_deps =
    ${base_config.lib_deps}
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    marian-craciunescu/ESP32Ping
build_flags =
    ${base_config.build_flags}
    -DILI9341_2_DRIVER
    -DTFT_MOSI=13 -DTFT_MISO=12 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
    -DTOUCH_CS=-1 -DTFT_INVERSION_ON -DSPI_FREQUENCY=27000000

[env:c3]
extends = base_config
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
upload_speed = 460800
build_src_filter = +<*> -<hal_cyd28.cpp>
lib_deps =
    ${base_config.lib_deps}
    bodmer/TFT_eSPI
    h2zero/NimBLE-Arduino@^2.0.0
build_flags =
    ${base_config.build_flags}
    -DTARGET_C3
    -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7789_DRIVER -DTFT_WIDTH=240 -DTFT_HEIGHT=320 -DTFT_RGB_ORDER=0
    -DTFT_MOSI=10 -DTFT_MISO=-1 -DTFT_SCLK=8 -DTFT_CS=3 -DTFT_DC=2 -DTFT_RST=9
    -DTFT_BL=-1 -DSPI_FREQUENCY=40000000
    ; NimBLE memory reduction — disable unused roles, single connection
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; env:p3 — ESP32-C3 + ST7789P3 display module (part no.), 284×76 landscape
[env:p3]
extends = base_config
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
upload_speed = 460800
build_src_filter = +<*> -<hal_cyd28.cpp>
lib_deps =
    ${base_config.lib_deps}
    bodmer/TFT_eSPI
    h2zero/NimBLE-Arduino@^2.0.0
build_flags =
    ${base_config.build_flags}
    -DTARGET_C3 -DTARGET_P3
    -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7789_DRIVER -DTFT_WIDTH=284 -DTFT_HEIGHT=76 -DTFT_RGB_ORDER=0
    -DTFT_MOSI=10 -DTFT_MISO=-1 -DTFT_SCLK=8 -DTFT_CS=3 -DTFT_DC=2 -DTFT_RST=9
    -DTFT_BL=5 -DSPI_FREQUENCY=40000000
    ; NimBLE memory reduction — disable unused roles, single connection
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; env:s2mini — ESP32-S2 Mini + USB HID keyboard via USB-C OTG + GPIO LED on GPIO 15
; 280326 Initial env added
; 290326 SPI pins: use native FSPI right-header pins (MOSI=35 MISO=37 SCK=36 CS=34); MISO must be real pin
; 290326 ARDUINO_USB_CDC_ON_BOOT=0: required to free OTG peripheral for USB host mode
; USB OTG used as host via USB-C — power S2 Mini from 5V header, supply keyboard VBUS externally
; Serial monitoring requires UART0 (GPIO 43=TX) with an external USB-UART adapter
[env:s2mini]
extends = base_config
board = lolin_s2_mini
board_build.partitions = huge_app.csv
upload_speed = 460800
build_src_filter = +<*> -<hal_cyd28.cpp> -<hal_c3.cpp>
lib_deps =
    ${base_config.lib_deps}
    bodmer/TFT_eSPI
build_flags =
    ${base_config.build_flags}
    -DTARGET_S2 -DTARGET_C3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DST7789_DRIVER -DTFT_WIDTH=240 -DTFT_HEIGHT=320 -DTFT_RGB_ORDER=0
    -DTFT_MOSI=35 -DTFT_MISO=37 -DTFT_SCLK=36 -DTFT_CS=34 -DTFT_DC=17 -DTFT_RST=18
    -DTFT_BL=-1 -DSPI_FREQUENCY=4000000

